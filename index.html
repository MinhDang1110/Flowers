<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flowers</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.42.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#g{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
#ov{position:absolute;inset:0;pointer-events:none}
.osu{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;cursor:pointer;pointer-events:auto;transition:opacity .5s}
.osu .core{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,232,246,.7);background:radial-gradient(circle,rgba(255,190,225,.16),rgba(220,70,150,.06) 62%,rgba(0,0,0,0) 72%);box-shadow:0 0 18px rgba(255,120,190,.45),inset 0 0 16px rgba(255,200,232,.3);animation:bt 1.4s ease-in-out infinite}
.osu .dot{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:rgba(255,240,250,.85);box-shadow:0 0 12px rgba(255,150,210,.9);animation:bt 1.4s ease-in-out infinite}
.osu .ap{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,205,235,.55);animation:ap 1.4s linear infinite}
@keyframes ap{0%{transform:scale(2.7);opacity:0}25%{opacity:1}100%{transform:scale(1);opacity:.8}}
@keyframes bt{50%{transform:scale(1.07);opacity:.75}}
.hit{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;border:2px solid rgba(255,235,248,.8);box-shadow:0 0 26px rgba(255,122,192,.7);pointer-events:none;animation:hit .7s ease-out forwards}
@keyframes hit{to{transform:scale(2.6);opacity:0}}
.ui{position:absolute;display:flex;gap:6px;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:5}
.ui.on{opacity:1;pointer-events:auto}
.ui button{background:rgba(12,6,24,.55);color:#f2d4ea;border:0.5px solid #6b3a5c;border-radius:8px;font-size:18px;width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .1s}
.ui button:hover{background:rgba(60,20,50,.7)}
.ui button:active{transform:scale(.95)}
.ui button.act{background:rgba(130,35,95,.6);border-color:#ff8cc6;color:#fff}
</style>
</head>
<body>
<h1 class="sr-only">Bầu trời đêm 3D với mưa sao băng dày đặc. Khi chạm vào vòng sáng trong suốt, một vườn tulip phát sáng nở rộ trên thảm cỏ đung đưa quanh người xem. Có thể kéo để nhìn quanh hoặc bay quanh vườn.</h1>
<div id="g">
<div id="ov"></div>
<div class="ui on" id="fsWrap" style="top:12px;left:12px"><button id="fs" aria-label="Toàn màn hình"><i class="ti ti-maximize" aria-hidden="true"></i></button></div>
<div class="ui" id="modes" style="top:12px;right:12px"><button id="bS" class="act" aria-label="Đứng giữa vườn"><i class="ti ti-walk" aria-hidden="true"></i></button><button id="bO" aria-label="Bay quanh vườn"><i class="ti ti-rotate-360" aria-hidden="true"></i></button></div>
<div class="ui" id="ctl" style="bottom:12px;right:12px"><button id="zo" aria-label="Thu nhỏ"><i class="ti ti-minus" aria-hidden="true"></i></button><button id="zi" aria-label="Phóng to"><i class="ti ti-plus" aria-hidden="true"></i></button><button id="rp" aria-label="Xem lại"><i class="ti ti-refresh" aria-hidden="true"></i></button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const box=document.getElementById('g'),ov=document.getElementById('ov');
let HH=box.clientHeight,WW=box.clientWidth;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eo=v=>{v=clamp(v,0,1);return 1-Math.pow(1-v,3);};
const back=v=>{v=clamp(v,0,1);const c=1.9,u=v-1;return 1+(c+1)*u*u*u+c*u*u;};
const renderer=new THREE.WebGLRenderer({antialias:true});
const PR=Math.min(window.devicePixelRatio||1,2);renderer.setPixelRatio(PR);renderer.setSize(WW,HH);
const cv=renderer.domElement;cv.style.display='block';cv.style.touchAction='none';cv.style.cursor='grab';box.insertBefore(cv,box.firstChild);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000006);scene.fog=new THREE.FogExp2(0x000006,0.07);
const camera=new THREE.PerspectiveCamera(65,WW/HH,0.03,1500);
const uTime={value:0},uScale={value:400},uPR={value:PR};
const SWAY='vec3 sway(vec3 p){float h=max(p.y,0.);float k=h*h;p.x+=sin(uTime*1.3+p.x*.6+p.z*.4)*.07*k;p.z+=cos(uTime*1.05+p.z*.5+p.x*.3)*.05*k;return p;}\n';
const PROJ='vec4 mvPosition=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\nmvPosition=instanceMatrix*mvPosition;\n#endif\nmvPosition.xyz=sway(mvPosition.xyz);\nmvPosition=modelViewMatrix*mvPosition;\ngl_Position=projectionMatrix*mvPosition;';
function swayMat(m){m.onBeforeCompile=s=>{s.uniforms.uTime=uTime;s.vertexShader='uniform float uTime;\n'+SWAY+s.vertexShader.replace('#include <project_vertex>',PROJ);};return m;}
const GRASSPROJ='vec4 mvPosition=instanceMatrix*vec4(transformed,1.0);\nfloat gk=transformed.y*transformed.y*30.;\nfloat gw=sin(uTime*.9+mvPosition.x*.35+mvPosition.z*.25);\nmvPosition.x+=(sin(uTime*1.3+mvPosition.x*1.4+mvPosition.z*.8)*.03+gw*.035)*gk;\nmvPosition.z+=(cos(uTime*1.1+mvPosition.z*1.2+mvPosition.x*.6)*.025+gw*.02)*gk;\nmvPosition=modelViewMatrix*mvPosition;\ngl_Position=projectionMatrix*mvPosition;';
function glowTex(stops){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const r=g.createRadialGradient(64,64,0,64,64,64);stops.forEach(s=>r.addColorStop(s[0],s[1]));g.fillStyle=r;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
const softTex=glowTex([[0,'rgba(255,255,255,1)'],[0.2,'rgba(255,255,255,0.55)'],[1,'rgba(255,255,255,0)']]);

const sky=new THREE.Group();scene.add(sky);
const STARV='attribute float aSize;attribute float aPh;attribute vec3 aCol;uniform float uTime;uniform float uPR;varying vec3 vC;varying float vA;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;gl_PointSize=aSize*uPR;vA=.5+.5*sin(uTime*(.6+aPh*2.4)+aPh*50.);vC=aCol;}';
const STARF='varying vec3 vC;varying float vA;void main(){float r=length(gl_PointCoord-.5)*2.;float a=exp(-r*r*5.);gl_FragColor=vec4(vC*a*(.35+.65*vA),1.);}';
function addPts(n,fn){const P=new Float32Array(n*3),C=new Float32Array(n*3),S=new Float32Array(n),F=new Float32Array(n);let k=0;
for(let i=0;i<n;i++){const o=fn();if(!o)continue;P.set(o[0],k*3);C.set(o[1],k*3);S[k]=o[2];F[k]=Math.random();k++;}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('aCol',new THREE.BufferAttribute(C,3));g.setAttribute('aSize',new THREE.BufferAttribute(S,1));g.setAttribute('aPh',new THREE.BufferAttribute(F,1));g.setDrawRange(0,k);
const p=new THREE.Points(g,new THREE.ShaderMaterial({uniforms:{uTime,uPR},vertexShader:STARV,fragmentShader:STARF,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));p.frustumCulled=false;sky.add(p);}
const sph=()=>{const u=Math.random()*2-1,a=Math.random()*6.283,s=Math.sqrt(1-u*u);return new THREE.Vector3(s*Math.cos(a),u,s*Math.sin(a));};
const SC=[[1,1,1],[.75,.85,1],[1,.9,.75],[1,.8,.88]];
addPts(5200,()=>{const d=sph();if(d.y<-0.05)return null;return [d.multiplyScalar(500).toArray(),SC[Math.random()*4|0],rnd(1.4,3.2)];});
addPts(300,()=>{const d=sph();if(d.y<0)return null;return [d.multiplyScalar(500).toArray(),SC[Math.random()*4|0],rnd(4,6.5)];});
const nAx=new THREE.Vector3(.35,.55,.75).normalize(),aAx=new THREE.Vector3(1,0,0).cross(nAx).normalize(),bAx=nAx.clone().cross(aAx);
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;
const band=a=>aAx.clone().multiplyScalar(Math.cos(a)).add(bAx.clone().multiplyScalar(Math.sin(a)));
addPts(9000,()=>{const d=band(Math.random()*6.283).add(nAx.clone().multiplyScalar(gauss()*0.13)).normalize();if(d.y<-0.05)return null;const k=rnd(.25,.6);return [d.multiplyScalar(500).toArray(),[k*.85,k*.8,k],rnd(1,2.4)];});
[0x6a4cff,0xff4fa8,0x3f8cff,0xb04cff].forEach((c,i)=>{for(let j=0;j<2;j++){const d=band(i*0.8+j*3.2+0.3);if(d.y<0.05)continue;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:softTex,color:c,transparent:true,opacity:0.09,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));s.position.copy(d.multiplyScalar(470));s.scale.setScalar(rnd(220,320));sky.add(s);}});
const moon=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex([[0,'#fffbea'],[0.17,'#fff3cf'],[0.21,'rgba(255,236,200,0.35)'],[0.5,'rgba(255,220,190,0.08)'],[1,'rgba(255,220,190,0)']]),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
moon.position.set(Math.sin(2.3)*Math.cos(0.55),Math.sin(0.55),Math.cos(2.3)*Math.cos(0.55)).multiplyScalar(460);moon.scale.setScalar(110);sky.add(moon);

const MAXM=70,mP=new Float32Array(MAXM*6),mC=new Float32Array(MAXM*6),hP=new Float32Array(MAXM*3),hC=new Float32Array(MAXM*3);
const mg=new THREE.BufferGeometry();mg.setAttribute('position',new THREE.BufferAttribute(mP,3));mg.setAttribute('color',new THREE.BufferAttribute(mC,3));
const mLines=new THREE.LineSegments(mg,new THREE.LineBasicMaterial({vertexColors:true,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,fog:false}));mLines.frustumCulled=false;sky.add(mLines);
const hg=new THREE.BufferGeometry();hg.setAttribute('position',new THREE.BufferAttribute(hP,3));hg.setAttribute('color',new THREE.BufferAttribute(hC,3));
const mHeads=new THREE.Points(hg,new THREE.PointsMaterial({size:9,sizeAttenuation:false,vertexColors:true,map:softTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));mHeads.frustumCulled=false;sky.add(mHeads);
let meteors=[];
const radDir=new THREE.Vector3(-.5,-.75,.3).normalize();
function spawnMeteor(){if(meteors.length>=MAXM)return;const az=Math.random()*6.283,el=rnd(.3,1.3);
const n=new THREE.Vector3(Math.cos(el)*Math.sin(az),Math.sin(el),Math.cos(el)*Math.cos(az));
const v=radDir.clone().add(new THREE.Vector3(rnd(-.35,.35),rnd(-.2,.2),rnd(-.35,.35)));v.sub(n.clone().multiplyScalar(v.dot(n))).setLength(rnd(180,340));
const tint=[[1,.95,.95],[.8,.9,1],[1,.85,.95],[.9,.85,1]][Math.random()*4|0];
meteors.push({p:n.multiplyScalar(450),v,age:0,life:rnd(.6,1.4),len:rnd(35,100),tint,br:rnd(.6,1)});}
function updateMeteors(dt){meteors.forEach(m=>m.age+=dt);meteors=meteors.filter(m=>m.age<m.life);
for(let i=0;i<MAXM;i++){const m=meteors[i];if(!m){mC.fill(0,i*6,i*6+6);hC.fill(0,i*3,i*3+3);continue;}
const h=m.p.clone().add(m.v.clone().multiplyScalar(m.age)),dn=m.v.clone().normalize(),tl=h.clone().sub(dn.multiplyScalar(m.len*Math.min(1,m.age*5)));
const f=Math.sin(Math.PI*m.age/m.life)*m.br;
mP.set([h.x,h.y,h.z,tl.x,tl.y,tl.z],i*6);mC.set([m.tint[0]*f,m.tint[1]*f,m.tint[2]*f,0,0,0],i*6);hP.set([h.x,h.y,h.z],i*3);hC.set([f,f,f],i*3);}
mg.attributes.position.needsUpdate=true;mg.attributes.color.needsUpdate=true;hg.attributes.position.needsUpdate=true;hg.attributes.color.needsUpdate=true;}

const ground=new THREE.Mesh(new THREE.CircleGeometry(900,64),new THREE.MeshBasicMaterial({color:0x041210}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const grassG=new THREE.BufferGeometry();
grassG.setAttribute('position',new THREE.Float32BufferAttribute([-.013,0,0,.013,0,0,-.009,.09,.012,.009,.09,.012,.002,.185,.04],3));
grassG.setAttribute('color',new THREE.Float32BufferAttribute([.2,.2,.2,.2,.2,.2,.55,.55,.55,.55,.55,.55,1,1,1],3));
grassG.setIndex([0,1,2,1,3,2,2,3,4]);
const grassMat=new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide});
grassMat.onBeforeCompile=s=>{s.uniforms.uTime=uTime;s.vertexShader='uniform float uTime;\n'+s.vertexShader.replace('#include <project_vertex>',GRASSPROJ);};
const NG=48000,grass=new THREE.InstancedMesh(grassG,grassMat,NG);grass.frustumCulled=false;
const D=new THREE.Object3D(),tc=new THREE.Color();
for(let i=0;i<NG;i++){const near=i<30000;const r=near?Math.sqrt(rnd(.0,6*6)):Math.sqrt(rnd(6*6,19*19)),a=rnd(0,6.283);
D.position.set(Math.sin(a)*r,0,Math.cos(a)*r);D.rotation.set(rnd(-.25,.25),rnd(0,6.28),rnd(-.15,.15),'YXZ');const sw=rnd(.8,1.35);D.scale.set(sw,rnd(.7,1.7),sw);D.updateMatrix();grass.setMatrixAt(i,D.matrix);
const k=rnd(.75,1.05);tc.setRGB(rnd(.07,.15)*k,rnd(.36,.56)*k,rnd(.28,.42)*k);grass.setColorAt(i,tc);}
grass.instanceColor.needsUpdate=true;scene.add(grass);

function gridGeo(su,sv,fn){const pos=[],col=[],idx=[];for(let i=0;i<=su;i++)for(let j=0;j<=sv;j++){const r=fn(i/su,j/sv*2-1);pos.push(r[0],r[1],r[2]);col.push(r[3],r[3],r[3]);}
for(let i=0;i<su;i++)for(let j=0;j<sv;j++){const a=i*(sv+1)+j,b=a+sv+1;idx.push(a,b,a+1,b,b+1,a+1);}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setIndex(idx);return g;}
const petalG=gridGeo(7,4,(u,v)=>{const w=.056*Math.sin(Math.PI*(.12+.8*u));return [v*w,u*.135,-v*v*w*.65+.015*Math.sin(Math.PI*u),(.3+.7*Math.pow(u,.75))*(1+.14*Math.abs(v))];});
const leafG=gridGeo(6,2,(u,v)=>{const w=.032*Math.sin(Math.PI*Math.min(1,.08+u*.95));return [v*w,u*.42*(1-.2*u),.14*u*u+Math.abs(v)*w*.3,.4+.6*u];});
const stemG=new THREE.CylinderGeometry(.008,.011,1,5,1,true);stemG.translate(0,.5,0);
const N=1400,PAL=[[1,.35,.62],[1,.2,.3],[.72,.38,1],[1,.82,.3],[1,.82,.92],[1,.5,.22],[.45,.58,1]];
const flowers=[];
for(let i=0;i<N;i++){const r=Math.sqrt(rnd(1.1*1.1,14*14)),a=rnd(0,6.283);const sec=((Math.floor(((a+r*.18)/6.283)*14))%7+7)%7;
flowers.push({x:Math.sin(a)*r,z:Math.cos(a)*r,r,sh:rnd(.42,.68),rot:rnd(0,6.28),lr:rnd(0,6.28),ls:rnd(.8,1.2),c:PAL[sec].map(v=>Math.min(1,v*rnd(.88,1.08))),d:0,done:false});}
const petals=new THREE.InstancedMesh(petalG,swayMat(new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide})),N*6);
const stems=new THREE.InstancedMesh(stemG,swayMat(new THREE.MeshBasicMaterial({color:0x237a50})),N);
const leaves=new THREE.InstancedMesh(leafG,swayMat(new THREE.MeshBasicMaterial({color:0x2f9a66,vertexColors:true,side:THREE.DoubleSide})),N*2);
[petals,stems,leaves].forEach(m=>{m.frustumCulled=false;m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(m);});
flowers.forEach((f,i)=>{for(let k=0;k<6;k++){const l=k>=3?1.08:1;tc.setRGB(Math.min(1,f.c[0]*l),Math.min(1,f.c[1]*l),Math.min(1,f.c[2]*l));petals.setColorAt(i*6+k,tc);}});
petals.instanceColor.needsUpdate=true;

const gPos=new Float32Array(N*3),gCol=new Float32Array(N*3),gSc=new Float32Array(N),gPh=new Float32Array(N);
flowers.forEach((f,i)=>{gPos.set([f.x,f.sh+.07,f.z],i*3);gCol.set(f.c,i*3);gPh[i]=Math.random()*6.28;});
const glowG=new THREE.BufferGeometry();glowG.setAttribute('position',new THREE.BufferAttribute(gPos,3));glowG.setAttribute('aCol',new THREE.BufferAttribute(gCol,3));glowG.setAttribute('aSc',new THREE.BufferAttribute(gSc,1));glowG.setAttribute('aPh',new THREE.BufferAttribute(gPh,1));
const glowPts=new THREE.Points(glowG,new THREE.ShaderMaterial({uniforms:{uTime,uScale,uPR},
vertexShader:'uniform float uTime;uniform float uScale;uniform float uPR;attribute vec3 aCol;attribute float aSc;attribute float aPh;varying vec3 vC;varying float vA;'+SWAY+'void main(){vec3 p=sway(position);vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;float d=max(-mv.z,.1);float pl=.8+.2*sin(uTime*1.7+aPh);gl_PointSize=min(.6*aSc*pl*uScale/d,240.)*uPR;vC=aCol;vA=aSc*exp(-pow(d*.045,2.));}',
fragmentShader:'varying vec3 vC;varying float vA;void main(){float r=length(gl_PointCoord-.5)*2.;float a=exp(-r*r*4.5)*.55+exp(-r*r*30.)*.5;gl_FragColor=vec4(vC*a*vA,1.);}',
blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));glowPts.frustumCulled=false;scene.add(glowPts);

const NF=360,fP=new Float32Array(NF*3),fS=new Float32Array(NF*3);
for(let i=0;i<NF;i++){const r=Math.sqrt(rnd(.5,15*15)),a=rnd(0,6.283);fP.set([Math.sin(a)*r,rnd(.25,2.6),Math.cos(a)*r],i*3);fS.set([Math.random(),Math.random(),Math.random()],i*3);}
const ffG=new THREE.BufferGeometry();ffG.setAttribute('position',new THREE.BufferAttribute(fP,3));ffG.setAttribute('aSeed',new THREE.BufferAttribute(fS,3));
const fireU={value:.12};
const ffPts=new THREE.Points(ffG,new THREE.ShaderMaterial({uniforms:{uTime,uScale,uPR,uVis:fireU},
vertexShader:'attribute vec3 aSeed;uniform float uTime;uniform float uScale;uniform float uPR;uniform float uVis;varying float vA;varying vec3 vC;void main(){vec3 s=aSeed;vec3 p=position+vec3(sin(uTime*(.3+s.x*.5)+s.y*6.28)*.8,sin(uTime*(.5+s.y*.6)+s.z*6.28)*.35,cos(uTime*(.25+s.z*.5)+s.x*6.28)*.8);vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;float d=max(-mv.z,.1);float bl=pow(max(0.,sin(uTime*(.8+s.x*1.5)+s.y*30.)),2.);gl_PointSize=min(.14*uScale/d,70.)*uPR;vA=bl*uVis*exp(-pow(d*.05,2.));vC=mix(vec3(1.,.85,.4),vec3(.7,1.,.5),s.z);}',
fragmentShader:'varying float vA;varying vec3 vC;void main(){float r=length(gl_PointCoord-.5)*2.;float a=exp(-r*r*6.)+exp(-r*r*60.);gl_FragColor=vec4(vC*a*vA,1.);}',
blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));ffPts.frustumCulled=false;scene.add(ffPts);

const NB=900,bV=new Float32Array(NB*3),bC=new Float32Array(NB*3);
for(let i=0;i<NB;i++){const a=rnd(0,6.283),s=rnd(2,8.5);bV.set([Math.sin(a)*s,rnd(.4,3.2),Math.cos(a)*s],i*3);bC.set(PAL[Math.random()*7|0],i*3);}
const bG=new THREE.BufferGeometry();bG.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NB*3),3));bG.setAttribute('aVel',new THREE.BufferAttribute(bV,3));bG.setAttribute('aCol',new THREE.BufferAttribute(bC,3));
const burstU={value:-1};
const burst=new THREE.Points(bG,new THREE.ShaderMaterial({uniforms:{uT:burstU,uScale,uPR},
vertexShader:'attribute vec3 aVel;attribute vec3 aCol;uniform float uT;uniform float uScale;uniform float uPR;varying float vA;varying vec3 vC;void main(){vec3 p=vec3(0.,.3,0.)+aVel*uT+vec3(0.,-1.2,0.)*uT*uT;vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;float d=max(-mv.z,.1);gl_PointSize=uT<0.?0.:min(.16*uScale/d,80.)*uPR;vA=uT<0.?0.:clamp(1.-uT/2.8,0.,1.);vC=aCol;}',
fragmentShader:'varying float vA;varying vec3 vC;void main(){float r=length(gl_PointCoord-.5)*2.;float a=exp(-r*r*5.);gl_FragColor=vec4(vC*a*vA,1.);}',
blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));burst.frustumCulled=false;scene.add(burst);
const ring=new THREE.Mesh(new THREE.RingGeometry(.96,1,96),new THREE.MeshBasicMaterial({color:0xff7ac0,transparent:true,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false,fog:false}));
ring.rotation.x=-Math.PI/2;ring.position.y=.03;ring.visible=false;scene.add(ring);

const HID=new THREE.Matrix4().makeScale(1e-5,1e-5,1e-5);
function hideGarden(){for(let i=0;i<N;i++){stems.setMatrixAt(i,HID);for(let j=0;j<2;j++)leaves.setMatrixAt(i*2+j,HID);for(let k=0;k<6;k++)petals.setMatrixAt(i*6+k,HID);gSc[i]=0;flowers[i].done=false;flowers[i].d=flowers[i].r/6.5+rnd(0,.25);}
[petals,stems,leaves].forEach(m=>m.instanceMatrix.needsUpdate=true);glowG.attributes.aSc.needsUpdate=true;}
function updateGarden(T){let active=false;
for(let i=0;i<N;i++){const f=flowers[i];if(f.done)continue;active=true;const tau=T-f.d;if(tau<0)continue;
const g=eo(tau/.35),lg=eo((tau-.1)/.4),s=back((tau-.22)/.35),o=eo((tau-.3)/.6);
D.position.set(f.x,0,f.z);D.rotation.set(0,0,0);D.scale.set(1,Math.max(1e-4,f.sh*g),1);D.updateMatrix();stems.setMatrixAt(i,D.matrix);
for(let j=0;j<2;j++){D.position.set(f.x,0,f.z);D.rotation.set(0,f.lr+j*Math.PI*.9,0);D.scale.setScalar(Math.max(1e-4,lg*f.ls*(j?.85:1)));D.updateMatrix();leaves.setMatrixAt(i*2+j,D.matrix);}
const hy=f.sh*g;
for(let k=0;k<6;k++){const inn=k>=3,th=f.rot+(k%3)*2.0944+(inn?1.0472:0),r0=inn?.008:.014,a=inn?-.22+.57*o:-.12+.84*o,sc=Math.max(1e-4,s*(inn?.93:1));
D.position.set(f.x+Math.sin(th)*r0*sc,hy,f.z+Math.cos(th)*r0*sc);D.rotation.set(a,th,0,'YXZ');D.scale.setScalar(sc);D.updateMatrix();petals.setMatrixAt(i*6+k,D.matrix);}
gSc[i]=o;if(tau>1.2)f.done=true;}
[petals,stems,leaves].forEach(m=>m.instanceMatrix.needsUpdate=true);glowG.attributes.aSc.needsUpdate=true;return active;}
hideGarden();

let mode='stand',yaw=0,pitch=.62,fovT=65,oyaw=.6,oel=.42,odist=9,idle=0;
const camPos=new THREE.Vector3(0,1.5,0),look=new THREE.Vector3(0,1.5+Math.sin(.62)*10,-Math.cos(.62)*10);
function desired(){if(mode==='stand'){const p=new THREE.Vector3(0,1.5,0);return [p,p.clone().add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(10))];}
const tg=new THREE.Vector3(0,.5,0);return [tg.clone().add(new THREE.Vector3(Math.sin(oyaw)*Math.cos(oel),Math.sin(oel),Math.cos(oyaw)*Math.cos(oel)).multiplyScalar(odist)),tg];}
let drag=false,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;idle=0;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;idle=0;
if(mode==='stand'){yaw-=dx*.004;pitch=clamp(pitch+dy*.004,-1.4,1.35);}else{oyaw-=dx*.006;oel=clamp(oel+dy*.004,.06,1.4);}});
const endDrag=()=>{drag=false;cv.style.cursor='grab';};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
function zoom(dir){idle=0;if(mode==='stand')fovT=clamp(fovT+dir*8,28,85);else odist=clamp(odist*(dir>0?1.2:.83),2.5,32);}
cv.addEventListener('wheel',e=>{e.preventDefault();idle=0;if(mode==='stand')fovT=clamp(fovT+e.deltaY*.03,28,85);else odist=clamp(odist*(1+e.deltaY*.001),2.5,32);},{passive:false});
document.getElementById('zi').onclick=()=>zoom(-1);document.getElementById('zo').onclick=()=>zoom(1);
const bS=document.getElementById('bS'),bO=document.getElementById('bO');
function setMode(m){mode=m;bS.classList.toggle('act',m==='stand');bO.classList.toggle('act',m==='orbit');}
bS.onclick=()=>{pitch=-.2;setMode('stand');};bO.onclick=()=>setMode('orbit');

let t=0,phase='intro',bloomT0=0,gardenActive=false,burstT=-1,nextMeteor=.2,osuEl=null,osuTimer=null;
function spawnOsu(){if(phase!=='intro')return;
if(osuEl){const old=osuEl;old.style.opacity=0;old.style.pointerEvents='none';setTimeout(()=>old.remove(),500);}
const el=document.createElement('div');el.className='osu';el.style.left=rnd(18,82)+'%';el.style.top=rnd(24,70)+'%';el.style.opacity=0;
el.setAttribute('role','button');el.setAttribute('aria-label','Mở vườn hoa');
el.innerHTML='<div class="ap"></div><div class="core"></div><div class="dot"></div>';
el.addEventListener('click',()=>hit(el));ov.appendChild(el);requestAnimationFrame(()=>el.style.opacity=1);osuEl=el;osuTimer=setTimeout(spawnOsu,3200);}
function hit(el){if(phase!=='intro')return;clearTimeout(osuTimer);
const h=document.createElement('div');h.className='hit';h.style.left=el.style.left;h.style.top=el.style.top;ov.appendChild(h);
setTimeout(()=>h.remove(),800);el.remove();osuEl=null;startBloom();}
function startBloom(){phase='bloom';bloomT0=t;gardenActive=true;burstT=0;pitch=-.2;fovT=65;setMode('stand');
for(let i=0;i<24;i++)setTimeout(spawnMeteor,i*60);
['modes','ctl'].forEach(id=>document.getElementById(id).classList.add('on'));}
document.getElementById('rp').onclick=()=>{phase='intro';gardenActive=false;hideGarden();setMode('stand');pitch=.62;fovT=65;
['modes','ctl'].forEach(id=>document.getElementById(id).classList.remove('on'));spawnOsu();};

const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);t+=dt;uTime.value=t;idle+=dt;
nextMeteor-=dt;while(nextMeteor<=0){spawnMeteor();nextMeteor+=phase==='intro'?rnd(.03,.14):rnd(.06,.3);}
updateMeteors(dt);
if(gardenActive)gardenActive=updateGarden(t-bloomT0);
if(burstT>=0){burstT+=dt;burstU.value=burstT;ring.visible=true;ring.scale.setScalar(.01+6.5*burstT);ring.material.opacity=Math.max(0,1-burstT/2.4);
if(burstT>3){burstT=-1;burstU.value=-1;ring.visible=false;}}
fireU.value+=((phase==='bloom'?1:.12)-fireU.value)*.02;
if(mode==='orbit'&&idle>3)oyaw+=dt*.08;
camera.fov+=((mode==='stand'?fovT:58)-camera.fov)*.08;camera.updateProjectionMatrix();
uScale.value=(HH/2)/Math.tan(camera.fov*Math.PI/360);
const ds=desired();camPos.lerp(ds[0],.05);look.lerp(ds[1],.06);camera.position.copy(camPos);camera.lookAt(look);
sky.position.copy(camera.position);
renderer.render(scene,camera);}

function fit(){WW=box.clientWidth;HH=box.clientHeight;renderer.setSize(WW,HH);camera.aspect=WW/HH;camera.updateProjectionMatrix();}
window.addEventListener('resize',fit);
document.addEventListener('fullscreenchange',fit);

const fsBtn=document.getElementById('fs'),de=document.documentElement;
if(!de.requestFullscreen)document.getElementById('fsWrap').style.display='none';
function toggleFS(){if(!document.fullscreenElement)de.requestFullscreen().catch(()=>{});else document.exitFullscreen();}
fsBtn.onclick=toggleFS;
document.addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')toggleFS();});
document.addEventListener('fullscreenchange',()=>{const on=!!document.fullscreenElement;fsBtn.innerHTML=on?'<i class="ti ti-minimize" aria-hidden="true"></i>':'<i class="ti ti-maximize" aria-hidden="true"></i>';fsBtn.setAttribute('aria-label',on?'Thoát toàn màn hình':'Toàn màn hình');});

spawnOsu();loop();
</script>
</body>
</html>
